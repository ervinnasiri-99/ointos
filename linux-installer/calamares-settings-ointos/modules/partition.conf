---
# OintOS partition settings (key names per upstream PartitionViewStep.cpp;
# schema file is stale — trust the code, not the schema).
#
# ext4 default (decision 008): Btrfs dropped after the unpackfs RAM freeze
# (build15: 8GB live VM froze ~13% unpack, 4.1Gi tmpfs writes, rsync 11).
# ext4-only choices; manual mode offers nothing else.
# - userSwapChoices is REQUIRED by the module. Kubuntu resolute verbatim:
#   [none, file] + file. small/suspend create a real swap PARTITION;
#   file = swapfile later, no partition (build17: suspend made sda2 swap).
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - file
# "file" keeps erase to ESP + root only; rootcheck guard fails fast if / unmounted.
initialSwapChoice: file
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
defaultFileSystemType: "ext4"
availableFileSystemTypes: ["ext4"]
# Explicit root layout (build19: no-partitionLayout default emitted ZERO
# root partitions — ESP only, rootcheck exit 32. Upstream default SHOULD be
# single / 100%, but don't rely on it. EndeavourOS/Kicksecure pattern:
# filesystem unknown defers to defaultFileSystemType/user choice).
partitionLayout:
    -   name: "rootfs"
        filesystem: "unknown"
        mountPoint: "/"
        size: 100%
