---
# OintOS partition settings (key names per upstream PartitionViewStep.cpp;
# schema file is stale — trust the code, not the schema).
#
# - defaultFileSystemType: propose Btrfs root by default
# - availableFileSystemTypes (plural): choices offered in manual mode
# - userSwapChoices is REQUIRED by the module; initialSwapChoice=file
#   creates a swapfile (no separate partition needed)
efiSystemPartition: "/boot/efi"
enableLuksAutomatedPartitioning: true
luksGeneration: luks2
userSwapChoices:
    - none
    - small
    - suspend
    - file
# 8GB-RAM safety: 5.57GB unpacked payload + page cache can exhaust RAM
# while rsync runs. "suspend" sizes the swapfile to RAM (also
# hibernation-capable); "file" is a small swapfile.
initialSwapChoice: suspend
drawNestedPartitions: true
alwaysShowPartitionLabels: true
allowManualPartitioning: true
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["ext4", "btrfs", "xfs"]
