---
# OintOS partition settings.
# - enable os-prober for dual-boot detection
# - default to Btrfs filesystem for the root
#
# Calamares partitioning module options:
#   initialPartitioningChoice, userSupportedPartitioningModes,
#   defaultPartitioningImplementation, neverCreateSwap, swap,
#   allowManualPartitioning, allowEmptyPartitions, ...
defaultPartitioningTableType: gpt
defaultPartitioningImplementation: gpt
alwaysShowPartitionLabels: true
enableLuksAutomatePartitioning: true

# Filesystem to propose for the root partition by default
defaultFilesystemType: btrfs

# Never require swap before the root (Calamares will still allow it if wanted)
neverCreateSwap: false
drawNestedPartitions: false

# Usually 'gpt' for UEFI. BIOS will fall back to 'mbr' automatically.
# os-prober integration
efiUseRecommendedPartitioning: true

# Extra filesystems that may be proposed
availableFilesystems:
    -   btrfs
    -   ext4
    -   xfs
    -   fat

# Allow the user to create/manage an EFI system partition, a /boot and swap.
allowManualPartitioning: true
allowEmptyPartitions: false
allowResize: true