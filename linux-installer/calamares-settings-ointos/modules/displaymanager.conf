---
# OintOS display manager config (KDE Plasma → SDDM)
displaymanagers:
    -   sddm
basicSetup: false
# OintOS ships SDDM as the KDE display manager
displayManagerName: sddm

# The instance is registered unconditionally; Calamares enables only what's
# installed. (sddm is installed in the live + target via kde-plasma-desktop)