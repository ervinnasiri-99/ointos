---
# OintOS mount config (key names per upstream mount.conf example +
# mount.schema.yaml which has additionalProperties:false, so ONLY these
# keys are valid: extraMounts, btrfsSubvolumes, btrfsSwapSubvol,
# mountOptions. Entry keys are `mountPoint` (capital P) + `subvolume`.)
#
# Btrfs subvolume layout is the Ubuntu/Timeshift type: /@ holds root,
# /home/@home etc. created on the root filesystem by the mount module.
extraMounts:
    -   device: proc
        fs: proc
        mountPoint: /proc
    -   device: sys
        fs: sysfs
        mountPoint: /sys
    -   device: /dev
        mountPoint: /dev
        options: [ bind ]
    -   device: tmpfs
        fs: tmpfs
        mountPoint: /run
    -   device: /run/udev
        mountPoint: /run/udev
        options: [ bind ]
    -   device: efivarfs
        fs: efivarfs
        mountPoint: /sys/firmware/efi/efivars
        efi: true

btrfsSubvolumes:
    -   mountPoint: /
        subvolume: /@
    -   mountPoint: /home
        subvolume: /@home
    -   mountPoint: /var/cache
        subvolume: /@cache
    -   mountPoint: /var/log
        subvolume: /@log

btrfsSwapSubvol: /@swap

mountOptions:
    -   filesystem: default
        options: [ defaults ]
    -   filesystem: efi
        options: [ defaults, umask=0077 ]
    -   filesystem: btrfs
        options: [ defaults, compress=zstd:1 ]
    -   filesystem: btrfs_swap
        options: [ defaults, noatime ]
