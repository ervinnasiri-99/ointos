---
# OintOS: Btrfs subvolume layout (Timeshift-compatible @/@home)
# This creates the Ubuntu-type subvolume layout Timeshift mandates.
mountOptions:
    -   default

# List of the Btrfs subvolumes to create on the root filesystem.
btrfsSubvolumes:
    -   mountpoint: /
        subvolume: /
    -   mountpoint: /home
        subvolume: /@home
    -   mountpoint: /var/cache
        subvolume: /@cache
    -   mountpoint: /var/log
        subvolume: /@log
    -   mountpoint: /boot/swap            # (reserve for swap subvol if used)
        subvolume: /@swap

efiMountOptions:
    -   utf8
    -   codepage=437
    -   iocharset=iso8859-1

# Set CRYPTO inside encrypted LUKS volume.
cryptoPassphrase: ""

# Mount point targets for the same filesystem that will be unmounted before install
extraMounts:
    -   - /run
        -    - efivars

mntConfig:
    # Mount /boot/efi (ESP) if auto-detected
    important: false