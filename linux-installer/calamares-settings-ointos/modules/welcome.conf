---
# OintOS welcome page (mirrors Kubuntu's welcome.conf).
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false

requirements:
    # 5.57GB unpacked payload + filesystem metadata + swapfile headroom.
    # 8GB lets users START an install that then dies mid-rsync with
    # "code 11" when the disk actually fills — 12GB is the honest floor.
    requiredStorage: 12
    requiredRam: 4
    internetCheckUrl: https://networkcheck.kde.org
    check:
        - storage
        - ram
        - power
        - internet
        - root
    required:
        - root
        - storage
        - ram

# GeoIP disabled (fixed style ignores lookup; URL must still be valid)
geoip:
    style: "none"
    url: "https://geoip.ubuntu.com/lookup"
    selector: "CountryCode"
