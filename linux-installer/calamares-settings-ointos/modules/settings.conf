---
# OintOS Calamares settings.conf
# Based on the official Calamares 3.3.14 settings.conf format.
# See: https://calamares.codeberg.page/docs/deploy-configuration/
#
# Calamares 3.3.x does NOT have --is-installer; it reads the installer mode
# from this settings.conf: the exec sequence determines installer vs welcome.
#
# Launch: sudo calamares (or ointos-installer-prompt for Wayland env)
# Debug:  sudo calamares -d

# modules-search: REMOVED — let Calamares use built-in defaults.
# Our custom paths didn't match the installed multiarch path
# (/usr/lib/x86_64-linux-gnu/calamares/modules/), causing all modules
# to be invisible. Calamares 3.3.x knows its own module paths.

instances:
    -   id:       unpackfs
        module:   unpackfs
        config:   unpackfs.conf

    -   id:       partition
        module:   partition
        config:   partition.conf

    -   id:       mount
        module:   mount
        config:   mount.conf

    -   id:       users
        module:   users
        config:   users.conf

    -   id:       bootloader
        module:   bootloader
        config:   bootloader.conf

    -   id:       shellprocess
        module:   shellprocess
        config:   shellprocess.conf

    -   id:       displaymanager
        module:   displaymanager
        config:   displaymanager.conf

sequence:
    -   show:
        -   welcome
        -   locale
        -   keyboard
        -   partition
        -   users
        -   summary
    -   exec:
        -   partition
        -   mount
        -   unpackfs
        -   users
        -   displaymanager
        -   bootloader
        -   shellprocess
    -   show:
        -   finished

branding: ointos

# Required booleans for Calamares 3.3.x (will complain if not set)
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false