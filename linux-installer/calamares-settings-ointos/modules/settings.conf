---
# OintOS Calamares settings.conf
# Ordered module sequence for the OintOS install flow.
# Calamares reads this from /etc/calamares/settings.conf
#
# Phases:
#   locale | keyboard | partition | mount | unpackfs | users | displaymanager |
#   bootloader | shellprocess | finish
#
# The "unattended" driver (linux-installer/unattended/plan.py) replaces this
# with an exec-only variant (partition → mount → unpackfs → users → bootloader
# → shellprocess) when running headless from an install plan.

modules-search:
    -   local
    -   /usr/lib/calamares/modules

instances:
    -   id:       unpackfs
        module:   unpackfs
        config:   unpackfs.conf

    -   id:       partition
        module:   partition
        config:   partition.conf

    -   id:       mount
        module:   mount
        config:   mount.conf

    -   id:       users
        module:   users
        config:   users.conf

    -   id:       bootloader
        module:   bootloader
        config:   bootloader.conf

    -   id:       shellprocess     # for post-install late-commands
        module:   shellprocess
        config:   shellprocess.conf

sequence:
    -   show:
        -   welcome
        -   locale
        -   keyboard
        -   partition
        -   users
        -   summary
    -   exec:
        -   partition
        -   mount
        -   unpackfs
        -   users
        -   displaymanager
        -   bootloader
        -   shellprocess
        -   finished

# Branding shown during install
branding: ointos
prompt-install: false
dont-chroot: false