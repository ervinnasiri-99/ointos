---
# OintOS Calamares settings.conf
# Reference: Kubuntu's kubuntu/settings.conf
# (lubuntu-team/calamares-settings-ubuntu, branch ubuntu/oracular).
#
# CRITICAL: `modules-search: [ local ]` MUST be present. Without it the
# search list is EMPTY, zero modules are found, and EVERY module in the
# sequence fails with "not found in module search paths" (Settings.cpp:
# missing node -> empty list, no builtin default). `local` resolves to
# $LIBDIR/calamares/modules (/usr/lib/x86_64-linux-gnu/calamares/modules)
# with configs in /etc/calamares/modules or /usr/share/calamares/modules.
#
# Launch: sudo calamares (or ointos-installer-prompt for Wayland env)
# Debug:  sudo calamares -d
modules-search: [ local ]

instances:
    -   id:       unpackfs
        module:   unpackfs
        config:   unpackfs.conf

    -   id:       partition
        module:   partition
        config:   partition.conf

    -   id:       mount
        module:   mount
        config:   mount.conf

    -   id:       users
        module:   users
        config:   users.conf

    -   id:       bootloader
        module:   bootloader
        config:   bootloader.conf

    -   id:       shellprocess
        module:   shellprocess
        config:   shellprocess.conf

    -   id:       rootcheck
        module:   shellprocess
        config:   shellprocess_rootcheck.conf

    -   id:       displaymanager
        module:   displaymanager
        config:   displaymanager.conf

# Exec chain trimmed from Kubuntu's: dropped Ubuntu-OEM/Kubuntu-only steps
# (oemprep, fixconkeys, pkgselect, automirror, packages, initcpio/initcpiocfg
# which are Arch-only, luksbootkeyfile/luksopenswaphookcfg which need LUKS
# setup we don't do). Every module below ships in Ubuntu's `calamares`
# package (verified via packages.ubuntu.com resolute/amd64 file list).
sequence:
    -   show:
        -   welcome
        -   locale
        -   keyboard
        -   partition
        -   users
        -   summary
    -   exec:
        -   partition
        -   mount
        -   rootcheck
        -   unpackfs
        -   machineid
        -   fstab
        -   locale
        -   keyboard
        -   localecfg
        -   users
        -   displaymanager
        -   networkcfg
        -   hwclock
        -   grubcfg
        -   bootloader
        -   shellprocess
        -   umount
    -   show:
        -   finished

branding: ointos

# Required booleans for Calamares 3.3.x (will complain if not set)
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
