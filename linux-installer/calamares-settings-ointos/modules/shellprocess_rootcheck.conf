---
# OintOS root-mount guard (shellprocess@rootcheck instance).
# Runs on the LIVE side (dontChroot: true) between mount and unpackfs.
# Aborts the install BEFORE rsync if / is not actually mounted at ${ROOT}.
# (build17: mount job mounted only boot/efi, reported success, unpackfs
# filled /tmp tmpfs 100% -> rsync 11. mount/main.py warns-only on failure,
# unpackfs/main.py only checks the dir exists — this is the fail-fast.)
dontChroot: true
timeout: 60
verbose: true
script:
    -   command: 'mountpoint -q "${ROOT}"'
        timeout: 60
