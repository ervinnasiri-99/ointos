---
# OintOS post-install hooks (shellprocess module).
# CRITICAL: the key is `script:` (list), NOT `scripts:` — with `scripts:`
# the module sees an empty script and does nothing. Schema requires `script`.
# Leading "-" ("-update-grub") is make-style ignore-failure per upstream
# shellprocess.conf — intentional, not a typo.
# ${ROOT} is the target root (in target context after chroot it is /).
dontChroot: false
timeout: 300
verbose: true
script:
    -   command: "-update-grub"
        timeout: 300
    # Post-install: leave no installer behind on the installed system.
    # unpackfs copies the whole live root, so without this the target keeps
    # installer icons, autostart, sudoers and Calamares itself.
    -   command: "rm -f /usr/bin/ointos-installer-prompt /usr/share/applications/ointos-installer.desktop /usr/share/applications/calamares.desktop /usr/share/applications/*kubuntu*.desktop /etc/xdg/autostart/ointos-installer.desktop /etc/xdg/autostart/*calamares*.desktop /etc/xdg/autostart/*kubuntu*.desktop /etc/sudoers.d/ointos-installer"
        timeout: 60
    -   command: "rm -rf /usr/share/calamares /etc/calamares /home/oinstaller/Desktop/Install*.desktop /root/Desktop/Install*.desktop /home/*/Desktop/Install*.desktop /etc/skel/Desktop/Install*.desktop"
        timeout: 60
    -   command: "-apt-get purge -y calamares calamares-settings-kubuntu calamares-data"
        timeout: 300
