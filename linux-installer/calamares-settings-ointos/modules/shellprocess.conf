---
# OintOS post-install hooks (shellprocess module).
# Commands run AFTER the target OS is unpacked.
# ${ROOT} is the mountpoint of the target root.
scripts:
    -   name: "system-rollback-ready"
        command: "test -d '${ROOT}/etc/timeshift' || mkdir -p '${ROOT}/etc/timeshift'"
    -   name: "update-grub"
        command: "chroot ${ROOT} update-grub || true"
    -   name: "create-initial-timeshift-snapshot"
        # Placeholder: Phase 5 wires the real Timeshift baseline snapshot.
        command: "true"