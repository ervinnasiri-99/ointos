---
# OintOS bootloader configuration.
# GRUB is used. On UEFI, prefer shim+GRUB when Secure Boot is on; GRUB
# directly otherwise. Non-Secure-Boot UEFI + BIOS work today.
efiBootLoader: grub
grubInstallTarget: /boot

# os-prober so Linux/Windows dual-boot entries are found
osproberEnabled: true

# Which entry Calamares should set as the default first boot
defaultEntryName: OintOS

# Timeout in seconds before GRUB boots the default entry
GRUB_DISABLE_OS_PROBER: false
GRUB_CMDLINE_LINUX_DEFAULT: "quiet splash"

# UEFI fallback (bless the fallback path) — only relevant if shim unavailable
efiFallback: true

# Re-run update-grub at the end (ensures os-prober entries are committed)
grubReuse: false