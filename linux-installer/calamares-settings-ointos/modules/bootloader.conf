---
# OintOS bootloader (only keys from upstream bootloader.schema.yaml, which
# has additionalProperties:false — anything else is rejected/ignored).
# GRUB for EFI + BIOS. EFI id falls back to branding bootloaderEntryName.
efiBootLoader: "grub"

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

installEFIFallback: true
installHybridGRUB: false
