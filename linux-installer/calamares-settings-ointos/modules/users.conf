---
# OintOS user creation (merges Kubuntu's groups with our no-autologin default).
# Upstream schema requires: defaultGroups, autologinGroup, sudoersGroup.
doAutologin: false
setRootPassword: false
sudoersGroup: sudo
autologinGroup: autologin
defaultGroups:
    - adm
    - cdrom
    - dip
    - lpadmin
    - plugdev
    - sambashare
    - sudo
passwordRequirements:
    minLength: 1
    maxLength: -1
user:
    shell: /bin/bash
    forbidden_names: [ root, oinstaller ]
