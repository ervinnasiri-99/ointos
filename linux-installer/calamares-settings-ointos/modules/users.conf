---
# OintOS user creation (installer asks the user to create an account).
autologinUser: ""
doAutologin: false
doReusePassword: true
sudoersGroup: sudo
setRootPassword: false
doRootPassword: false
allowRootPassword: true

# We do NOT ship default user/password here — the installer prompts at install.
# (During the live test, the interactive flow handles this.)