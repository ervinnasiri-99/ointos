# OintOS unattended install plan (subiquity-shaped for Libertix handoff)
# Example: full-disk ext4 install (decision 008: btrfs dropped) + late command.
identity:
  username: ervin
  hostname: ointos
storage:
  disk: /dev/sda
  layout: gpt
  efi: true
  filesystem: ext4
late_commands:
  - "chroot ${ROOT} update-grub || true"
  - "chroot ${ROOT} touch /etc/ointos-installed"