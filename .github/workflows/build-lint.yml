name: Build Config Validation

# Lightweight validation of the distro-build pipeline.
# Runs on every push/PR and on a schedule.
#
# IMPORTANT: This deliberately does NOT run the full ISO build — the manual
# casper pipeline (isobuild.sh) needs ~25 GB disk and 30-90 min, exceeding
# GitHub Actions free-tier runner limits (~14 GB usable disk). It also requires
# mount/privileged ops best done in WSL2 or a local Docker container.
# See docs/master-prompt.md risk #1. Full builds run on the Ryzen/WSL2 machine.

on:
  push:
    paths:
      - "distro-build/**"
      - ".github/workflows/build-lint.yml"
  pull_request:
    paths:
      - "distro-build/**"
  schedule:
    # Weekly to catch upstream package drift
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  validate-shell:
    name: Shellcheck build scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck isobuild.sh + setup-wsl.sh
        run: |
          set -e
          shellcheck -x distro-build/isobuild.sh
          shellcheck -x distro-build/setup-wsl.sh
          echo "OK: shell scripts pass shellcheck"

  validate-packages:
    name: Validate package set against Ubuntu resolute
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check referenced packages resolve in resolute
        run: |
          set -euo pipefail
          # Extract package names from isobuild.sh apt-get install lists
          # (lines inside the heredoc blocks that are bare package tokens).
          grep -oE '^[a-z0-9][a-z0-9.+:-]*$' distro-build/isobuild.sh \
            | sort -u > /tmp/ref-pkgs.txt
          echo "Referenced package-like tokens:"
          cat /tmp/ref-pkgs.txt
          echo "---"
          # The real resolution check lives in the actual build (apt inside
          # the chroot). Here we just sanity-check we didn't reference the
          # known-removed packages we already dropped.
          if grep -qE '^(spectacle|oxygen5|wireless-tools|grub-legacy)$' /tmp/ref-pkgs.txt; then
            echo "ERROR: referenced a known-removed/obsolete package"
            exit 1
          fi
          echo "OK: no known-removed packages referenced"

  drivetrain-check:
    name: Check isobuild.sh reads cleanly and steps are ordered
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax + step presence
        run: |
          set -euo pipefail
          bash -n distro-build/isobuild.sh
          grep -q "debootstrap" distro-build/isobuild.sh \
            && echo "OK: debootstrap present"
          grep -q "xorriso -as mkisofs" distro-build/isobuild.sh \
            && echo "OK: xorriso assembly present"
          grep -q "mksquashfs" distro-build/isobuild.sh \
            && echo "OK: squashfs present"
          echo "OK: core pipeline steps present"